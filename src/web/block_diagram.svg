<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#17202b">
  <title>Embedded integration block diagram (design; devices are simulated in software)</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b3261e"/></marker>
  </defs>
  <rect width="820" height="480" fill="#ffffff"/>

  <!-- USB links -->
  <g stroke="#0b5cad" stroke-width="2.5" fill="none">
    <path d="M165 240H200"/>
    <path d="M345 225C380 225 375 85 420 85"/>
    <path d="M345 240H420"/>
    <path d="M345 255C380 255 375 395 420 395"/>
  </g>
  <g font-size="10" fill="#0b5cad" font-weight="600">
    <text x="168" y="233">USB</text>
    <text x="352" y="120">USB</text>
    <text x="370" y="234">USB</text>
    <text x="352" y="370">USB</text>
  </g>

  <!-- JTAG debug path: adapter -> MCU -->
  <path d="M760 395H790V85H760" stroke="#b3261e" stroke-width="2.5" stroke-dasharray="7 4" fill="none" marker-end="url(#arr)"/>
  <text x="804" y="240" transform="rotate(-90 804 240)" text-anchor="middle" fill="#b3261e" font-weight="600" font-size="10">JTAG/SWD: TCK TMS TDI nRESET out · TDO in · VTref · GND</text>

  <!-- optional MCU <-> FPGA logic link -->
  <path d="M590 145V180" stroke="#2e8540" stroke-width="2.5" stroke-dasharray="2 4" fill="none"/>
  <text x="598" y="167" fill="#2e8540" font-size="10" font-weight="600">optional UART/SPI, 3.3 V both sides</text>

  <g stroke="#55626f" stroke-width="1.5">
    <rect x="15" y="175" width="150" height="130" rx="8" fill="#eef3f9"/>
    <rect x="200" y="195" width="145" height="90" rx="8" fill="#f4f6f8"/>
    <rect x="420" y="25" width="340" height="120" rx="8" fill="#f2f8f3"/>
    <rect x="420" y="180" width="340" height="120" rx="8" fill="#f6f2fa"/>
    <rect x="420" y="335" width="340" height="120" rx="8" fill="#fbf1ef"/>
  </g>

  <text x="25" y="196" font-weight="700" font-size="12">Host PC</text>
  <text x="25" y="214">Windows 11 x64</text>
  <text x="25" y="231">Workbench UI + C++ core</text>
  <text x="25" y="248">Device manager:</text>
  <text x="25" y="265">one adapter per device</text>
  <text x="25" y="290" fill="#4d5b6a">USB ports 5 V / 0.5 A</text>

  <text x="210" y="216" font-weight="700" font-size="12">Powered USB hub</text>
  <text x="210" y="234">USB 2.0, own 5 V PSU</text>
  <text x="210" y="251">common GND reference</text>
  <text x="210" y="268">per-port overcurrent</text>

  <text x="430" y="45" font-weight="700" font-size="12">MCU · STM32 Nucleo-F446RE (assumed)</text>
  <text x="430" y="63">Host: ST-LINK virtual COM port, 115200 8N1</text>
  <text x="430" y="80">Power: 5 V USB → on-board 3.3 V regulator</text>
  <text x="430" y="97">I/O: 3.3 V; only FT pins are 5 V tolerant</text>
  <text x="430" y="114">External debug: CN2 jumpers removed</text>
  <text x="430" y="133" fill="#4d5b6a">Telemetry: die temperature, VDD, uptime</text>

  <text x="430" y="200" font-weight="700" font-size="12">FPGA · Digilent Arty A7-35T (assumed)</text>
  <text x="430" y="218">Host: FT2232H, ch.A JTAG config, ch.B UART</text>
  <text x="430" y="235">Power: 5 V USB (7–15 V jack if heavy)</text>
  <text x="430" y="252">I/O: 3.3 V banks, 1.0 V core; NOT 5 V tolerant</text>
  <text x="430" y="269">Its JTAG belongs to the on-board FTDI</text>
  <text x="430" y="288" fill="#4d5b6a">Telemetry: XADC temperature, VCCINT</text>

  <text x="430" y="355" font-weight="700" font-size="12">JTAG adapter · SEGGER J-Link EDU Mini</text>
  <text x="430" y="373">Host: USB 2.0. Debug probe only, no workload</text>
  <text x="430" y="390">Target: 10-pin 1.27 mm Cortex Debug → MCU</text>
  <text x="430" y="407">Senses VTref (1.2–5 V), drives at that level</text>
  <text x="430" y="424">Does not power the target; one target at a time</text>
  <text x="430" y="443" fill="#4d5b6a">Telemetry: VTref, TCK frequency, chain length</text>

  <g font-size="10" fill="#4d5b6a">
    <text x="15" y="345" font-weight="700">Legend</text>
    <path d="M15 360h30" stroke="#0b5cad" stroke-width="2.5"/><text x="52" y="364">USB host link</text>
    <path d="M15 380h30" stroke="#b3261e" stroke-width="2.5" stroke-dasharray="7 4"/><text x="52" y="384">JTAG/SWD debug</text>
    <path d="M15 400h30" stroke="#2e8540" stroke-width="2.5" stroke-dasharray="2 4"/><text x="52" y="404">optional logic link</text>
    <text x="15" y="428">One GND reference via the hub; add a</text>
    <text x="15" y="442">GND wire with any board-to-board signal.</text>
    <text x="15" y="462" font-weight="700" fill="#8a5300">All device behaviour SIMULATED.</text>
  </g>
</svg>
