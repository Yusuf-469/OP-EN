<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="Fira Sans, Segoe UI, sans-serif" font-size="11.5" fill="#17202b">
  <title>Embedded integration block diagram (design; devices simulated in software)</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b3261e"/></marker>
  </defs>
  <rect width="760" height="470" fill="#ffffff"/>
  <g stroke="#0b5cad" stroke-width="2.5" fill="none">
    <path d="M170 235H210"/>
    <path d="M320 225C360 225 360 80 400 80"/>
    <path d="M320 235H400"/>
    <path d="M320 245C360 245 360 390 400 390"/>
  </g>
  <g font-size="10.5" fill="#0b5cad" font-weight="600">
    <text x="173" y="228">USB 2.0</text>
    <text x="328" y="128" transform="rotate(-62 328 128)">USB (ST-LINK)</text>
    <text x="336" y="230">USB (FT2232H)</text>
    <text x="332" y="330" transform="rotate(62 332 330)">USB (J-Link)</text>
  </g>
  <path d="M730 400H748V90H730" stroke="#b3261e" stroke-width="2.5" stroke-dasharray="7 4" fill="none" marker-end="url(#arr)"/>
  <text x="742" y="250" transform="rotate(-90 742 250)" text-anchor="middle" fill="#b3261e" font-weight="600" font-size="10.5">JTAG: TCK/TMS/TDI/nRESET out · TDO in · VTref · GND</text>
  <path d="M560 140V175" stroke="#2e8540" stroke-width="2.5" stroke-dasharray="2 4" fill="none"/>
  <text x="568" y="162" fill="#2e8540" font-size="10.5" font-weight="600">optional UART/SPI, 3.3 V↔3.3 V, 100 Ω series + GND</text>

  <g stroke="#55626f" stroke-width="1.5">
    <rect x="20" y="170" width="150" height="130" rx="8" fill="#eef3f9"/>
    <rect x="210" y="190" width="110" height="90" rx="8" fill="#f4f6f8"/>
    <rect x="400" y="20" width="330" height="120" rx="8" fill="#f2f8f3"/>
    <rect x="400" y="175" width="330" height="120" rx="8" fill="#f6f2fa"/>
    <rect x="400" y="330" width="330" height="120" rx="8" fill="#fbf1ef"/>
  </g>
  <g>
    <text x="30" y="192" font-weight="700" font-size="12.5">Host PC</text>
    <text x="30" y="210">Windows 11 x64</text>
    <text x="30" y="228">Workbench UI + C++ core</text>
    <text x="30" y="246">Device manager with one</text>
    <text x="30" y="262">adapter per device type</text>
    <text x="30" y="286" fill="#4d5b6a">USB host ports, 5 V / 0.5 A</text>

    <text x="220" y="212" font-weight="700" font-size="12.5">Powered USB hub</text>
    <text x="220" y="230">USB 2.0, own 5 V PSU</text>
    <text x="220" y="248">common GND reference</text>
    <text x="220" y="266">per-port overcurrent</text>

    <text x="410" y="40" font-weight="700" font-size="12.5">Microcontroller · STM32 Nucleo-F446RE (assumed)</text>
    <text x="410" y="58">Host link: ST-LINK/V2-1 virtual COM port, UART 115200 8N1</text>
    <text x="410" y="75">Power: 5 V USB → on-board 3.3 V LDO</text>
    <text x="410" y="92">I/O: 3.3 V (only FT pins 5 V tolerant)</text>
    <text x="410" y="109">Debug: on-board SWD, or external J-Link (CN2 jumpers off)</text>
    <text x="410" y="128" fill="#4d5b6a">Telemetry: die temperature, VDD, uptime</text>

    <text x="410" y="195" font-weight="700" font-size="12.5">FPGA · Digilent Arty A7-35T, XC7A35T (assumed)</text>
    <text x="410" y="213">Host link: FT2232H ch.A = JTAG config, ch.B = UART</text>
    <text x="410" y="230">Power: 5 V USB (or 7–15 V jack for heavy designs)</text>
    <text x="410" y="247">I/O: 3.3 V banks, VCCINT 1.0 V; NOT 5 V tolerant</text>
    <text x="410" y="264">JTAG owned by on-board FTDI; not shared with J-Link</text>
    <text x="410" y="283" fill="#4d5b6a">Telemetry: XADC temperature, VCCINT</text>

    <text x="410" y="350" font-weight="700" font-size="12.5">JTAG debug adapter · SEGGER J-Link EDU Mini (assumed)</text>
    <text x="410" y="368">Host link: USB 2.0; debug probe only, runs no workload</text>
    <text x="410" y="385">Target: 10-pin 1.27 mm Cortex Debug → MCU JTAG/SWD</text>
    <text x="410" y="402">Senses VTref (1.2–5 V) and drives at target voltage</text>
    <text x="410" y="419">Does NOT power the target; one target TAP at a time</text>
    <text x="410" y="438" fill="#4d5b6a">Telemetry: VTref, TCK frequency, chain length</text>
  </g>
  <g font-size="10.5" fill="#4d5b6a">
    <text x="20" y="335">Legend</text>
    <path d="M20 350h34" stroke="#0b5cad" stroke-width="2.5"/><text x="60" y="354">USB host link</text>
    <path d="M20 370h34" stroke="#b3261e" stroke-width="2.5" stroke-dasharray="7 4"/><text x="60" y="374">JTAG/SWD debug</text>
    <path d="M20 390h34" stroke="#2e8540" stroke-width="2.5" stroke-dasharray="2 4"/><text x="60" y="394">optional logic link</text>
    <text x="20" y="420">Grounding: single reference via hub;</text>
    <text x="20" y="434">add a GND wire with every board-to-</text>
    <text x="20" y="448">board signal. Prototype: SIMULATED.</text>
  </g>
</svg>
